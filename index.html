<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gym Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }

/* Layout: single column, big title bar, routine cards, exercise tables with per-set rows,
   floating pill nav + floating rest-timer bar. Dark-first, black ground, blue action colour. */
:root {
  --bg: #000000;
  --surface: #1c1c1e;
  --surface2: #2a2a2d;
  --ink: #f2f2f4;
  --muted: #8e8e93;
  --line: #2c2c2e;
  --accent: #3b8bf6;
  --accent-text: #5aa0ff;
  --accent-ink: #ffffff;
  --ok: #2fb86a;
  --ok-soft: #12301f;
  --warm: #f5b21a;
  --drop: #b57bff;
  --fail: #f0583a;
  --danger: #ff6a5e;
  --font: "Figtree", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f2f2f6; --surface: #ffffff; --surface2: #e8e8ed; --ink: #111113; --muted: #6c6c70; --line: #dcdce1;
    --accent: #2f7ae5; --accent-text: #1d63c8; --ok: #1f9a57; --ok-soft: #d9f2e3; --warm: #b87a00; --drop: #7a3fd1;
    --fail: #d33f20; --danger: #d93025; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f2f2f6; --surface: #ffffff; --surface2: #e8e8ed; --ink: #111113; --muted: #6c6c70; --line: #dcdce1;
  --accent: #2f7ae5; --accent-text: #1d63c8; --ok: #1f9a57; --ok-soft: #d9f2e3; --warm: #b87a00; --drop: #7a3fd1;
  --fail: #d33f20; --danger: #d93025; color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.35;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 170px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; }
.wrap { max-width: 640px; margin: 0 auto; }
.stack { display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3, p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font-size: 14px; font-weight: 600; color: var(--muted); }

/* bars */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 10px; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); }
.bar h1 { font-size: 34px; font-weight: 700; letter-spacing: -.01em; }
.bar h2 { font-size: 18px; font-weight: 600; text-align: center; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-r { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.sync { font-size: 12px; color: var(--muted); }
.circle { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); display: grid; place-items: center; flex: none; }
.circle svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.chip { border: 0; background: var(--surface); color: var(--muted); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; min-height: 30px; }
.chip[aria-pressed="true"] { color: var(--accent-text); }

/* buttons */
.btn { border: 0; background: var(--surface2); border-radius: 10px; padding: 0 16px; min-height: 46px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.small { min-height: 38px; padding: 0 14px; font-size: 15px; }
.btn.block { width: 100%; }
.btn.plain { background: transparent; color: var(--danger); }
.btn.armed { background: var(--danger); color: #fff; }
.btn.text { background: transparent; color: var(--accent-text); }
.btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { border: 0; background: var(--surface); border-radius: 12px; min-height: 58px; padding: 0 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; }
.tile svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* routine cards */
.rcard { background: var(--surface); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.rhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.rhead h3 { font-size: 20px; font-weight: 700; overflow-wrap: anywhere; }
.dots { border: 0; background: transparent; width: 40px; height: 36px; margin: -6px -8px 0 0; display: grid; place-items: center; color: var(--muted); flex: none; }
.dots svg { width: 22px; height: 22px; fill: currentColor; }
.rex { color: var(--muted); font-size: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; overflow-wrap: anywhere; }
.menu { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 8px; }
.resume { background: var(--surface); border: 1px solid var(--accent); border-radius: 14px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.resume b { display: block; }
.resume span { font-size: 14px; color: var(--muted); }
.empty { background: var(--surface); border-radius: 14px; padding: 28px 18px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 14px; align-items: center; }

/* routine name + exercises */
.rname { width: 100%; height: 52px; border: 0; background: var(--surface); border-radius: 12px; padding: 0 16px; font-size: 22px; font-weight: 700; }
.rname::placeholder, .srow input::placeholder, .addex input::placeholder { color: var(--muted); font-weight: 500; opacity: .7; }
.ex { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ex-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.exname { font-size: 19px; font-weight: 600; color: var(--accent-text); overflow-wrap: anywhere; min-width: 0; }
.rest { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; flex-wrap: wrap; }
.rest svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; flex: none; }
.rest .btn { min-height: 32px; min-width: 36px; padding: 0 8px; font-size: 18px; border-radius: 8px; }
.rest b { color: var(--ink); font-weight: 600; min-width: 74px; text-align: center; font-variant-numeric: tabular-nums; }
.thead, .srow { display: grid; grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1fr); gap: 6px; align-items: center; }
.live .thead, .srow.live { grid-template-columns: 40px minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 1fr) 46px; }
.thead { font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--muted); text-align: center; padding: 0 8px; }
.srow { padding: 4px 8px; border-radius: 10px; min-height: 52px; }
.srow.alt { background: var(--surface); }
.srow.done { background: var(--ok-soft); }
.stype { border: 0; background: transparent; height: 44px; font-size: 18px; font-weight: 700; color: var(--muted); border-radius: 8px; }
.stype.W { color: var(--warm); } .stype.D { color: var(--drop); } .stype.F { color: var(--fail); }
.srow input { width: 100%; min-width: 0; height: 44px; border: 0; background: transparent; text-align: center; font-size: 18px; font-weight: 600; border-radius: 8px; font-variant-numeric: tabular-nums; padding: 0; }
.srow input:focus { background: var(--surface2); outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.prev { border: 0; background: transparent; color: var(--muted); font-size: 15px; height: 44px; font-variant-numeric: tabular-nums; border-radius: 8px; padding: 0; }
.chk { width: 46px; height: 40px; border: 0; border-radius: 8px; background: var(--surface2); display: grid; place-items: center; padding: 0; }
.chk svg { width: 22px; height: 22px; stroke: var(--muted); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.srow.done .chk { background: var(--ok); }
.srow.done .chk svg { stroke: #fff; }
.addex { display: flex; gap: 8px; }
.addex input { flex: 1; min-width: 0; height: 48px; border: 0; background: var(--surface); border-radius: 10px; padding: 0 14px; }

/* session */
.metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding-bottom: 4px; }
.metrics small { display: block; font-size: 13px; color: var(--muted); }
.metrics b { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* history */
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.summary div { background: var(--surface); border-radius: 12px; padding: 12px; }
.summary b { display: block; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.summary small { font-size: 12px; color: var(--muted); }
.panel { background: var(--surface); border-radius: 14px; padding: 14px 16px; }
.pr { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
.pr:first-of-type { border-top: 0; }
.pr span { min-width: 0; overflow-wrap: anywhere; }
.pr b { white-space: nowrap; font-variant-numeric: tabular-nums; }
details.h { background: var(--surface); border-radius: 14px; }
details.h summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
details.h summary::-webkit-details-marker { display: none; }
details.h h3 { font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
details.h .sub { font-size: 13px; color: var(--muted); }
details.h .vol { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.hbody { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.hbody p { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.hbody p b { display: block; color: var(--accent-text); font-size: 15px; font-weight: 600; }

/* rest timer */
#timer {
  position: fixed; left: 0; right: 0; margin-inline: auto; z-index: 20; width: min(608px, calc(100% - 32px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
  background: var(--surface2); color: var(--ink); border-radius: 14px; padding: 10px 12px;
  display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  box-shadow: 0 6px 24px rgba(0, 0, 0, .35); border: 1px solid var(--line);
}
body.nonav #timer { bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
#timer.done { background: var(--ok); color: #fff; border-color: var(--ok); }
.ring { width: 52px; height: 52px; }
.ring svg { width: 52px; height: 52px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 5; }
.ring .bg { stroke: currentColor; opacity: .18; }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
#timer.done .fg { stroke: #fff; }
.t-main { min-width: 0; }
.t-main b { display: block; font-size: 30px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.t-main span { display: block; font-size: 13px; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-btns { display: flex; gap: 6px; }
.t-btns button { border: 0; background: color-mix(in srgb, currentColor 14%, transparent); color: inherit; border-radius: 10px; min-width: 44px; height: 44px; font-weight: 600; font-size: 14px; padding: 0 10px; }
@media (max-width: 420px) { .t-btns .adj { display: none; } }

/* nav pill */
nav { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); z-index: 15; display: flex; justify-content: center; pointer-events: none; }
nav .pill { pointer-events: auto; display: flex; gap: 4px; padding: 5px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0, 0, 0, .35); }
nav button { border: 0; background: transparent; color: var(--ink); width: 120px; height: 60px; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; font-weight: 500; }
nav button svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav button[aria-current="page"] { background: var(--surface2); color: var(--accent-text); }

/* picker */
#picker { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 32px); }
.pk-in { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.pk-bar { position: sticky; top: 0; z-index: 2; background: var(--bg); }
.pk-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pk-tile { border: 0; background: var(--surface); border-radius: 12px; padding: 14px; text-align: left; min-height: 70px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.pk-tile b { font-size: 18px; font-weight: 700; }
.pk-tile small { color: var(--muted); font-size: 13px; }
.pk-row { width: 100%; border: 0; background: var(--surface); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; text-align: left; min-height: 62px; }
.pk-row.custom { color: var(--accent-text); font-weight: 600; }
.pk-ck { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; }
.pk-ck svg { width: 15px; height: 15px; stroke: transparent; fill: none; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
.pk-row.on { box-shadow: inset 0 0 0 2px var(--accent); }
.pk-row.on .pk-ck { background: var(--accent); border-color: var(--accent); }
.pk-row.on .pk-ck svg { stroke: #fff; }
.pk-t { min-width: 0; }
.pk-t b { display: block; font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.pk-t small { display: block; color: var(--muted); font-size: 13px; }
.pk-note { background: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: var(--muted); }

/* no double-tap zoom, drag-to-reorder, select-on-focus */
* { touch-action: manipulation; }
button { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.ex-head { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.ex-head .exname { flex: 1; }
.grip { color: var(--muted); display: grid; place-items: center; width: 22px; height: 36px; flex: none; margin-left: -4px; }
.grip svg { width: 18px; height: 18px; fill: currentColor; }
.reordering .ex > :not(.ex-head) { display: none; }
.reordering .ex { background: var(--surface); border-radius: 12px; padding: 4px 12px; }
.ex.dragging { position: relative; z-index: 50; background: var(--surface2) !important; box-shadow: 0 8px 28px rgba(0, 0, 0, .45); }

/* exercise images */
.thumb { width: 60px; height: 40px; border: 0; padding: 0; border-radius: 8px; overflow: hidden; background: var(--surface2); flex: none; display: grid; place-items: center; color: var(--muted); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb svg, .pk-ph svg, .ip-ph svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.pk-img, .pk-ph { width: 76px; height: 50px; border-radius: 8px; flex: none; object-fit: cover; background: var(--surface2); }
.pk-ph { display: grid; place-items: center; color: var(--muted); }
#imgpop { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .62); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.ip-card { width: min(380px, 100%); background: var(--surface); border-radius: 16px; overflow: hidden; box-shadow: 0 12px 40px rgba(0, 0, 0, .5); }
.ip-img { position: relative; aspect-ratio: 3 / 2; background: var(--surface2); }
.ip-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ip-img img.b { opacity: 0; transition: opacity .35s ease; }
.ip-ph { height: 120px; display: grid; place-items: center; color: var(--muted); background: var(--surface2); }
.ip-ph svg { width: 40px; height: 40px; }
.ip-txt { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
.ip-name { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
.ip-t { display: flex; flex-direction: column; gap: 1px; }
.ip-t small { font-size: 11px; letter-spacing: .1em; font-weight: 600; color: var(--muted); }
.ip-t b { font-size: 18px; font-weight: 700; color: var(--accent-text); }
.ip-t span { font-size: 14px; color: var(--muted); }
.ip-hint { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .ip-img img.b { transition: none; } }
#toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 70px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 30; font-weight: 600; max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: reduce) { .ring .fg { transition: none; } }
</style>
</head>
<body>


<div class="wrap"><main id="view" class="stack"></main></div>

<div id="timer" hidden>
  <div class="ring"><svg viewBox="0 0 52 52" aria-hidden="true"><circle class="bg" cx="26" cy="26" r="22"></circle><circle class="fg" id="ring" cx="26" cy="26" r="22" stroke-dasharray="138.23" stroke-dashoffset="0"></circle></svg></div>
  <div class="t-main"><b id="t-time">0:00</b><span id="t-label">Rest</span></div>
  <div class="t-btns">
    <button type="button" class="adj" data-t="minus" aria-label="15 seconds less">-15</button>
    <button type="button" class="adj" data-t="plus" aria-label="15 seconds more">+15</button>
    <button type="button" data-t="skip" id="t-skip">Skip</button>
  </div>
</div>
<div id="picker" hidden role="dialog" aria-modal="true" aria-label="Add exercise">
  <div class="pk-in">
    <div class="bar pk-bar"><button class="circle" data-pk="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg></button><h2 id="pk-title">Add Exercise</h2><button class="btn primary small" data-pk="add" id="pk-add" hidden>Add</button></div>
    <input class="rname" id="pk-q" type="search" placeholder="Search all exercises" autocomplete="off" aria-label="Search exercises">
    <div id="pk-body" class="stack"></div>
  </div>
</div>
<div id="imgpop" hidden role="dialog" aria-label="Exercise preview"></div>
<div id="toast" hidden role="status"></div>

<nav id="nav" aria-label="Main"><div class="pill">
  <button type="button" data-act="go" data-v="home" id="nav-home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5v5M6 7v10M18 7v10M21 9.5v5M6 12h12"></path></svg>Workout</button>
  <button type="button" data-act="go" data-v="history" id="nav-history"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>History</button>
</div></nav>


<script src="ex-images.js"></script>
<script>
(function () {
  "use strict";
  var KEY = "gymlog.v2", DOC = "gym2";
  var MUSCLES = [
    { k: "Chest", note: "Upper chest is the clavicular head, mid and lower chest are the sternal head. A bench angle of 15–30° is enough to favour the upper chest." },
    { k: "Back", note: "Pulldowns and pull-ups load the lats most. Rows with the elbows out wider shift work to the mid back (rhomboids, mid traps)." },
    { k: "Traps", note: "Upper traps shrug the shoulders up, mid traps pull them back, lower traps pull them down." },
    { k: "Lower Back", note: "Spinal erectors. Hip hinges also load the glutes and hamstrings." },
    { k: "Shoulders", note: "The deltoid has three heads: front, side (lateral) and rear. Presses hit the front and side heads, raises isolate the side head, reverse flys hit the rear head." },
